<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recon Query - 鸾鸟Agent</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css?v=20241224v2" />
  <style>
    #recon-app { display: flex; flex-direction: column; height: 100vh; }
    #recon-topbar { height: 56px; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
    #recon-layout { display: flex; flex: 1; overflow: hidden; }
    #recon-filter { width: 240px; background: var(--bg-app); border-right: 1px solid var(--border-color); padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; flex-shrink: 0; }
    #recon-results { flex: 1; overflow-y: auto; padding: 16px; background: var(--bg-app); }
    .filter-section { display: flex; flex-direction: column; gap: 8px; }
    .filter-title { font-size: 11px; font-weight: 600; color: var(--accent-primary); text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-checkbox { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-main); cursor: pointer; }
    .filter-checkbox input { width: 14px; height: 14px; accent-color: var(--accent-primary); }
    .recon-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; transition: all 0.15s; }
    .recon-card:hover { border-color: var(--border-highlight); }
    .recon-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .recon-type-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    .recon-target { font-size: 12px; font-weight: 500; color: var(--text-main); word-break: break-all; }
    .recon-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
    .recon-value { background: #0b1120; border: 1px solid #1e293b; padding: 8px; border-radius: 6px; font-family: var(--font-code); font-size: 11px; color: #a5d6ff; white-space: pre-wrap; overflow-x: auto; margin-top: 8px; max-height: 200px; overflow-y: auto; }
    .recon-empty { text-align: center; color: var(--text-muted); padding: 60px 20px; }
    .recon-summary-bar { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .recon-summary-pill { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 14px; font-size: 12px; color: var(--text-muted); }
    .recon-summary-pill b { color: var(--text-main); margin-right: 4px; }
    select, input[type="text"] { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; padding: 6px 10px; font-size: 12px; width: 100%; }
    select:focus, input[type="text"]:focus { border-color: var(--accent-primary); outline: none; }
    .type-domain { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .type-ip { background: rgba(139,92,246,0.15); color: #c084fc; }
    .type-port { background: rgba(16,185,129,0.15); color: #34d399; }
    .type-endpoint { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .type-service { background: rgba(6,182,212,0.15); color: #22d3ee; }
    .type-tech { background: rgba(236,72,153,0.15); color: #f472b6; }
    .type-credential { background: rgba(239,68,68,0.15); color: #f87171; }
    .type-sensitive { background: rgba(249,115,22,0.15); color: #fb923c; }
    .type-auth { background: rgba(132,204,22,0.15); color: #a3e635; }
    .type-file { background: rgba(100,116,139,0.15); color: #cbd5e1; }
    .type-default { background: rgba(100,116,139,0.15); color: #94a3b8; }
  </style>
</head>

<body>
  <div id="recon-app">
    <header id="recon-topbar">
      <div class="brand">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <span>Recon Query</span>
      </div>
      <div style="width:1px;height:24px;background:var(--border-color)"></div>
      <select id="task-selector" style="width:220px;" onchange="onTaskChange()">
        <option value="">选择任务...</option>
      </select>
      <input id="search-input" type="text" placeholder="搜索..." style="width:200px;" oninput="onSearch()" />
      <div style="flex:1"></div>
      <button class="btn" onclick="loadRecon()">刷新</button>
      <button class="btn" onclick="location.href='/'">返回主页面</button>
    </header>

    <div id="recon-layout">
      <aside id="recon-filter">
        <div class="filter-section">
          <div class="filter-title">类型过滤</div>
          <label class="filter-checkbox"><input type="checkbox" value="domain" checked onchange="applyFilters()"><span>domain</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="ip" checked onchange="applyFilters()"><span>ip</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="port" checked onchange="applyFilters()"><span>port</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="endpoint" checked onchange="applyFilters()"><span>endpoint</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="service" checked onchange="applyFilters()"><span>service</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="tech" checked onchange="applyFilters()"><span>tech</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="credential" checked onchange="applyFilters()"><span>credential</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="sensitive" checked onchange="applyFilters()"><span>sensitive</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="auth" checked onchange="applyFilters()"><span>auth</span></label>
          <label class="filter-checkbox"><input type="checkbox" value="file" checked onchange="applyFilters()"><span>file</span></label>
        </div>
        <div class="filter-section">
          <div class="filter-title">目标过滤</div>
          <select id="target-filter" onchange="applyFilters()">
            <option value="">全部目标</option>
          </select>
        </div>
      </aside>

      <main id="recon-results">
        <div id="summary-bar" class="recon-summary-bar"></div>
        <div id="results-list">
          <div class="recon-empty">选择一个任务查看侦察数据</div>
        </div>
      </main>
    </div>
  </div>

  <script src="/static/js/recon.js"></script>
</body>

</html>
